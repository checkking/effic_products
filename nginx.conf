# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name effic.online www.effic.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name effic.online www.effic.online;

    # SSL certificates (Let's Encrypt example paths)
    ssl_certificate     /etc/letsencrypt/live/effic.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/effic.online/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Language pages
    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }
    location /zh/ {
        try_files $uri $uri/ /zh/index.html;
    }
    location /es/ {
        try_files $uri $uri/ /es/index.html;
    }
    location /de/ {
        try_files $uri $uri/ /de/index.html;
    }
    location /ja/ {
        try_files $uri $uri/ /ja/index.html;
    }

    # Robots and sitemap
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
